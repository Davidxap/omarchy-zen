// Omarchy Zen live reload (autoconfig; the first line must be a comment).
//
// Polls <profile>/chrome/custom-zen.css once per second and, when it changes,
// re-registers its --custom-zen-* variables as an !important user sheet. Every
// rule in zen-auto-style-*.css reads those variables, so the new palette
// repaints chrome, about: pages and selection instantly without a restart.
//
// Profiles without the Omarchy Zen stylesheet are left untouched. Any failure
// is logged to the Browser Console and never blocks startup.
try {
  (() => {
    const POLL_MS = 1000;
    const { setInterval } = ChromeUtils.importESModule(
      "resource://gre/modules/Timer.sys.mjs"
    );
    const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(
      Ci.nsIStyleSheetService
    );
    let registered = null;
    let lastKey = null;

    const apply = css => {
      const important = css.replace(
        /(--custom-zen-[\w-]+\s*:[^;!{}]+);/g,
        "$1 !important;"
      );
      const uri = Services.io.newURI(
        "data:text/css;charset=utf-8," + encodeURIComponent(important)
      );
      sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
      if (registered && sss.sheetRegistered(registered, sss.USER_SHEET)) {
        sss.unregisterSheet(registered, sss.USER_SHEET);
      }
      registered = uri;
    };

    // nsIFile follows the chrome/custom-zen.css symlink, so a theme switch
    // that swaps the target file is seen as a new mtime/size.
    const poll = file => {
      try {
        const key = `${file.lastModifiedTime}:${file.fileSize}`;
        if (key === lastKey) return;
        const css = Cu.readUTF8File(file);
        lastKey = key;
        if (css.includes("--custom-zen-")) apply(css);
      } catch (e) {
        // Missing or half-written sheet during a theme switch: retry next tick.
        lastKey = null;
      }
    };

    const start = () => {
      Services.obs.removeObserver(start, "final-ui-startup");
      const chrome = Services.dirsvc.get("ProfD", Ci.nsIFile);
      chrome.append("chrome");
      const marker = chrome.clone();
      marker.append("zen-auto-style-chrome.css");
      if (!marker.exists()) return;
      const file = chrome.clone();
      file.append("custom-zen.css");
      poll(file);
      setInterval(() => poll(file.clone()), POLL_MS);
    };
    Services.obs.addObserver(start, "final-ui-startup");
  })();
} catch (e) {
  Cu.reportError(e);
}
